*{margin:0;padding:0;box-sizing:border-box;}
:root{

body{

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(140,31,40,.3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.border-deco{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,253,247,.92),rgba(252,247,237,.92));box-shadow:var(--shadow);}
.border-deco::before,.border-deco::after{content:"";position:absolute;width:16px;height:16px;pointer-events:none;border:2px solid var(--gold);opacity:.75;}

.border-deco::after{bottom:5px;right:5px;border-left:none;border-top:none;}
.divider{height:1px;margin:18px 0;position:relative;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);}
.divider::after{content:"❖";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--gold2);font-size:11px;background:var(--paper2);padding:0 8px;}
#app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 16px 60px;}

.coin-badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--gold);border-radius:20px;padding:2px 12px;background:linear-gradient(180deg,#fffdf6,#f5ecd6);font-size:12px;color:var(--gold2);}
.navbar{display:flex;gap:4px;flex-wrap:wrap;padding:14px 0 6px;}
.nav-btn{font-family:inherit;font-size:14px;letter-spacing:.12em;padding:8px 16px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--ink2);cursor:pointer;transition:all .25s;position:relative;}
.nav-btn:hover{color:var(--red);background:rgba(201,169,97,.12);}
.nav-btn.active{color:#fff8e8;background:linear-gradient(180deg,var(--red2),var(--red));border-color:var(--gold2);}
.page{display:none;animation:fadeUp .4s ease;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.panel{padding:26px 30px;margin-bottom:20px;border-radius:4px;}
.panel-title{font-size:20px;letter-spacing:.3em;color:var(--red);display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.panel-title::before{content:"◈";color:var(--gold2);font-size:14px;}
.panel-sub{font-size:12px;color:var(--ink2);opacity:.7;letter-spacing:.15em;margin-bottom:12px;}

.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}

.card-line{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed rgba(140,31,40,.1);}

.btn.sm{padding:4px 12px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink2);letter-spacing:.15em;margin-bottom:5px;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);width:100%;padding:8px 12px;border-radius:3px;border:1px solid rgba(140,31,40,.22);background:rgba(255,253,247,.8);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold2);}
textarea{resize:vertical;min-height:80px;line-height:1.8;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{font-weight:500;color:var(--red);letter-spacing:.12em;font-size:12px;padding:9px 10px;border-bottom:1.5px solid rgba(140,31,40,.25);text-align:left;background:rgba(201,169,97,.08);}
.tbl td{padding:9px 10px;border-bottom:1px dashed rgba(140,31,40,.12);color:var(--ink2);}
.tbl-wrap{overflow-x:auto;}
.empty{text-align:center;padding:36px 10px;color:var(--ink2);opacity:.55;font-size:13px;letter-spacing:.15em;}
.empty::before{content:"❁";display:block;font-size:26px;color:var(--gold);margin-bottom:10px;opacity:.6;}
.toast-wrap{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{padding:10px 26px;border-radius:3px;font-size:13px;letter-spacing:.12em;background:linear-gradient(180deg,#fffaf0,#f5ead2);border:1px solid var(--gold);color:var(--ink);animation:toastIn .35s ease;white-space:nowrap;}
.toast.ok{border-color:var(--jade);color:var(--jade);}
.toast.err{border-color:var(--red);color:var(--red);}

.modal-mask{position:fixed;inset:0;background:rgba(43,33,24,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-mask.show{display:flex;}
.modal{max-width:480px;width:100%;padding:30px;text-align:center;border-radius:4px;max-height:88vh;overflow-y:auto;}
.modal.wide{max-width:720px;text-align:left;}

.tl-item{position:relative;padding:0 0 18px 0;}

/* ======================= 默认数据库 ======================= */
function defaultDB(){
  return {
    session: null,
    users: {},
    archives: {},
    archiveSeq: 0,
    feiTong: [],
    juanTong: [],
    children: [],
    rankHistory: [],
    factions: [],
    parties: [],
    events: [],
    mapIn: JSON.parse(JSON.stringify(DEFAULT_MAP_IN)),
    mapOut: JSON.parse(JSON.stringify(DEFAULT_MAP_OUT)),
    shop: JSON.parse(JSON.stringify(DEFAULT_SHOP)),
    rules: DEFAULT_RULES,
    history: DEFAULT_HISTORY,
    globalLog: []
  };
}

/* ======================= 云端读写 ======================= */
function loadDB(callback){
  fetch(SUPABASE_URL + '/rest/v1/qianqiu?id=eq.' + DB_ID + '&select=data', {
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
  })
  .then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(function(arr){
    if(arr && arr.length && arr[0].data){
      DB = arr[0].data;
      var def = defaultDB();
      for(var k in def){ if(DB[k] === undefined) DB[k] = def[k]; }
    }else{
      DB = defaultDB();
      saveDB(true);
    }
    if(callback) callback(null);
  })
  .catch(function(e){
    console.error('云端读取失败', e);
    DB = defaultDB();
    if(callback) callback(e);
  });
}

function saveDB(immediate){
  if(!DB) return;
  if(isSaving) return;
  if(!immediate){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveDB(true); }, 400);
    return;
  }
  isSaving = true;
  fetch(SUPABASE_URL + '/rest/v1/qianqiu', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify({id: DB_ID, data: DB})
  })
  .then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
  })
  .catch(function(e){
    console.error('云端保存失败', e);
  })
  .then(function(){
    isSaving = false;
  });
}

/* ======================= 工具 ======================= */
function toast(msg, type){
  var w = document.getElementById('toastWrap');
  var d = document.createElement('div');
  d.className = 'toast ' + (type || '');
  d.textContent = msg;
  w.appendChild(d);
  setTimeout(function(){
    d.style.transition = 'opacity .4s';
    d.style.opacity = '0';
  }, 1800);
  setTimeout(function(){ d.remove(); }, 2300);
}
function now(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowFull(){
  var d = new Date();
  return now() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function cur(){ return DB && DB.session ? DB.users[DB.session] : null; }
function isAdmin(){ var u = cur(); return u && u.role === 'admin'; }
function newArchiveId(){
  DB.archiveSeq = (DB.archiveSeq || 0) + 1;
  return 'a' + DB.archiveSeq;
}
function myRank(){
  if(!DB || !DB.session) return '—';
  var myName = DB.session;
  for(var i = 0; i < DB.rankHistory.length; i++){
    if(DB.rankHistory[i].name === myName) return DB.rankHistory[i].to || '—';
  }
  var id = Object.keys(DB.archives).find(function(k){ return DB.archives[k].name === myName; });
  if(id && DB.archives[id].rank) return DB.archives[id].rank;
  return '—';
}
function pushLog(text){
  if(!DB || !DB.session) return;
  var u = cur(); if(!u) return;
  u.log = u.log || [];
  u.log.unshift({time: nowFull(), text: text});
  if(u.log.length > 100) u.log.length = 100;
  DB.globalLog.unshift({time: nowFull(), who: DB.session, text: text});
  if(DB.globalLog.length > 200) DB.globalLog.length = 200;
}

/* ======================= 登录 / 注册 ======================= */
function switchTab(t){
  var isLogin = t === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabReg').classList.toggle('active', !isLogin);
  document.getElementById('formLogin').classList.toggle('hide', !isLogin);
  document.getElementById('formReg').classList.toggle('hide', isLogin);
}

function doRegister(){
  var name = document.getElementById('regName').value.trim();
  var pwd  = document.getElementById('regPwd').value;
  var pwd2 = document.getElementById('regPwd2').value;
  var adminKey = document.getElementById('regAdminKey').value.trim();
  if(name.length < 2 || name.length > 12) return toast('名号需2-12字','err');
  if(pwd.length < 4) return toast('密钥至少4位','err');
  if(pwd !== pwd2) return toast('两次密钥不一致','err');
  if(DB.users[name]) return toast('此名号已被占用','err');
  var isAdminUser = adminKey === ADMIN_KEY;
  DB.users[name] = {
    pwd: pwd,
    role: isAdminUser ? 'admin' : 'member',
    createdAt: nowFull(),
    points: 0,
    skills: [],
    wisdomLog: [],
    log: []
  };
  DB.session = name;
  saveDB();
  toast(isAdminUser ? '立卷成功，您已是掌卷人' : '立卷成功', 'ok');
  enterSite();
}

function doLogin(){
  var name = document.getElementById('loginName').value.trim();
  var pwd  = document.getElementById('loginPwd').value;
  if(!DB){ toast('数据加载中，请稍候','err'); return; }
  var u = DB.users[name];
  if(!u) return toast('未寻得此名号','err');
  if(u.pwd !== pwd) return toast('密钥有误','err');
  DB.session = name;
  saveDB();
  toast('欢迎归卷，' + name, 'ok');
  enterSite();
}

function logout(){
  if(DB){ DB.session = null; saveDB(); }
  document.getElementById('app').classList.add('hide');
  document.getElementById('loginView').classList.remove('hide');
  document.getElementById('loginName').value = '';
  document.getElementById('loginPwd').value = '';
}

function saveArchive(id){
  if(!isAdmin()) return toast('无权限','err');
  function g(i){ var el = document.getElementById(i); return el ? el.value.trim() : ''; }
  var name = g('ea_name');
  if(!name) return toast('名讳不可为空','err');
  if(name.indexOf('檀') !== -1) return toast('名讳禁止使用「檀」字','err');
  var isNew = !id;
  if(isNew){
    var newId = newArchiveId();
    DB.archives[newId] = {
      id: newId, name: name,
      xiaozi: g('ea_xiaozi'), age: g('ea_age'), birthday: g('ea_birthday'),
      family: g('ea_family'), identity: g('ea_identity'), appearance: g('ea_appearance'),
      constitution: g('ea_constitution'), personality: g('ea_personality'),
      goodAt: g('ea_goodAt'), skill1: g('ea_skill1'), skill2: g('ea_skill2'), skill3: g('ea_skill3'),
      party: g('ea_party'), faction: g('ea_faction'), lifespan: g('ea_lifespan'),
      palace: g('ea_palace'), wisdom: g('ea_wisdom'), pregnancy: g('ea_pregnancy'),
      marriage: g('ea_marriage'), rank: g('ea_rank'), skin: g('ea_skin'),
      createdAt: nowFull(), updatedAt: nowFull()
    };
    pushLog('新增档案：' + name);
  }else{
    var a = DB.archives[id];
    if(!a) return;
    var beforeRank = a.rank;
    a.name = name; a.xiaozi = g('ea_xiaozi'); a.age = g('ea_age'); a.birthday = g('ea_birthday');
    a.family = g('ea_family'); a.identity = g('ea_identity'); a.appearance = g('ea_appearance');
    a.constitution = g('ea_constitution'); a.personality = g('ea_personality');
    a.goodAt = g('ea_goodAt'); a.skill1 = g('ea_skill1'); a.skill2 = g('ea_skill2'); a.skill3 = g('ea_skill3');
    a.party = g('ea_party'); a.faction = g('ea_faction'); a.lifespan = g('ea_lifespan');
    a.palace = g('ea_palace'); a.wisdom = g('ea_wisdom'); a.pregnancy = g('ea_pregnancy');
    a.marriage = g('ea_marriage'); a.rank = g('ea_rank'); a.skin = g('ea_skin');
    a.updatedAt = nowFull();
    if(beforeRank && a.rank && beforeRank !== a.rank){
      DB.rankHistory.unshift({time: nowFull(), name: a.name, from: beforeRank, to: a.rank, note: '档案更新'});
    }
    pushLog('更新档案：' + name);
  }
  saveDB();
  toast('已存档，全站可见','ok');
  closeModal();
  go('archive');
}

function deleteArchive(id){
  if(!isAdmin()) return toast('无权限','err');

  delete DB.archives[id];
  saveDB();
  toast('已删除');

}

/* ======================= 抽签弹窗 ======================= */
function showDrawModal(title, result, desc, gain, cb, hideGain){
  var mask = document.getElementById('modalMask');
  var box = document.getElementById('modalBox');
  box.className = 'modal border-deco';
  box.innerHTML = '<h3>' + esc(title) + '</h3><div class="result shaking" id="drawResult">？ ？ ？</div><div class="desc" id="drawDesc">签筒摇动，静候天意……</div><div class="desc" id="drawGain"></div><button type="button" class="btn primary" id="drawBtn" style="display:none;width:100%;">收 下</button>';
  mask.classList.add('show');
  var tick = 0;
  var fake = ['琴','棋','书','画','舞','歌','+1','+2','-1','-2','0'];
  var timer = setInterval(function(){
    var r = document.getElementById('drawResult');
    if(r) r.textContent = fake[Math.floor(Math.random() * fake.length)];
    tick++;
    if(tick > 16){
      clearInterval(timer);
      var rr = document.getElementById('drawResult');
      if(rr){ rr.classList.remove('shaking'); rr.textContent = result; }
      var dd = document.getElementById('drawDesc');
      if(dd) dd.textContent = desc;
      if(!hideGain && gain !== null && gain !== undefined){
        var dg = document.getElementById('drawGain');
        if(dg) dg.textContent = '所 获 · +' + gain;
      }
      var btn = document.getElementById('drawBtn');
      if(btn){
        btn.style.display = 'block';
        btn.onclick = function(){ mask.classList.remove('show'); if(cb) cb(); };
      }
    }
  }, 70);
}

function showModal(html, wide){
  var mask = document.getElementById('modalMask');
  var box = document.getElementById('modalBox');
  box.className = 'modal border-deco' + (wide ? ' wide' : '');
  box.innerHTML = html;
  mask.classList.add('show');
}

/* ======================= 朝堂事件 ======================= */
function renderEvent(){
  var html = '<div class="panel border-deco"><div class="panel-title">朝 堂 事 件</div>';
  html += '<div class="panel-sub">风 起 于 青 萍 之 末 · 全 站 公 开</div><div class="divider"></div>';
  if(isAdmin()){
    html += '<div class="grid g4" style="margin-bottom:14px;">';
    html += '<div class="field"><label>名 称</label><input id="ev_name"></div>';
    html += '<div class="field"><label>时 间</label><input id="ev_time" value="' + now() + '"></div>';
    html += '<div class="field"><label>性 质</label><select id="ev_type"><option>天灾</option><option>人祸</option><option>朝议</option><option>边患</option><option>宫闱</option><option>祥瑞</option><option>其他</option></select></div>';
    html += '<div class="field"><label>牵涉派系</label><input id="ev_faction"></div>';
    html += '</div>';
    html += '<div class="field"><label>详 情</label><textarea id="ev_desc"></textarea></div>';
    html += '<button type="button" class="btn primary" onclick="addEvent()">记 录 事 件</button><div class="divider"></div>';
  }
  if(DB.events.length){
    html += '<div class="timeline">';
    for(var i = 0; i < DB.events.length; i++){
      var e = DB.events[i];
      html += '<div class="tl-item">';
      html += '<div class="tl-time">' + esc(e.time) + ' · <span class="tag ' + (e.type === '祥瑞' ? 'jade' : 'red') + '">' + esc(e.type) + '</span></div>';
      html += '<div class="tl-text"><b>' + esc(e.name) + '</b></div>';
      html += '<div style="font-size:13px;color:var(--ink2);margin-top:4px;">' + esc(e.desc||'') + '</div>';
      if(e.faction) html += '<div style="font-size:12px;color:var(--gold2);margin-top:4px;">牵涉：' + esc(e.faction) + '</div>';
      if(isAdmin()) html += '<button type="button" class="btn ghost sm" style="margin-top:6px;" onclick="delItem(\'events\',' + i + ',\'event\')">删 除</button>';
      html += '</div>';
    }
    html += '</div>';
  }else{
    html += '<div class="empty">尚无朝堂事件</div>';
  }
  html += '</div>';
  document.getElementById('pg-event').innerHTML = html;
}

function addEvent(){

    desc: document.getElementById('ev_desc').value.trim()
  });
  saveDB();
  toast('已记录','ok');
  go('event');
}

function renderMe(){
  var u = cur();

  html += '<div class="panel-sub">账 号 信 息</div><div class="divider"></div>';
  html += '<div class="grid g2">';
  html += '<div class="card"><div class="card-name">账 号</div>';
  html += '<div class="card-line"><span>名号</span><b>' + esc(DB.session) + '</b></div>';
  html += '<div class="card-line"><span>身份</span><b>' + (u.role === 'admin' ? '掌卷人' : '入卷者') + '</b></div>';
  html += '<div class="card-line"><span>立卷</span><b>' + esc(u.createdAt) + '</b></div>';
  html += '<div class="card-line"><span>积分</span><b>' + (u.points||0) + '</b></div>';
  html += '<div class="card-line"><span>当前位份</span><b style="color:var(--red)">' + myRank() + '</b></div>';
  html += '</div>';
  html += '<div class="card"><div class="card-name">我 的 动 态</div>';
  if((u.log||[]).length){
    for(var i = 0; i < Math.min(u.log.length, 10); i++){
      var l = u.log[i];
      html += '<div style="font-size:12.5px;color:var(--ink2);padding:4px 0;border-bottom:1px dashed rgba(140,31,40,.1);"><span style="color:var(--gold2);font-size:11px;">' + esc(l.time) + '</span> · ' + esc(l.text) + '</div>';
    }
  }else{
    html += '<div style="font-size:13px;opacity:.5;">暂无动态</div>';
  }
  html += '</div></div>';
  html += '<div class="divider"></div><div class="panel-sub">修 改 密 钥</div>';
  html += '<button type="button" class="btn" onclick="changePwd()">修 改 密 钥</button>';
  if(isAdmin()){
    html += '<div class="divider"></div><div class="panel-sub">掌 卷 人 · 全 员 名 册</div>';
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>名号</th><th>身份</th><th>积分</th><th>立卷</th></tr></thead><tbody>';
    var names = Object.keys(DB.users);
    for(var k = 0; k < names.length; k++){
      var n = names[k];
      var uu = DB.users[n];
      html += '<tr><td><b style="color:var(--ink)">' + esc(n) + '</b></td><td>' + (uu.role === 'admin' ? '掌卷人' : '入卷者') + '</td><td>' + (uu.points||0) + '</td><td style="font-size:11px;">' + esc(uu.createdAt) + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }
  html += '</div>';
  document.getElementById('pg-me').innerHTML = html;
}

function changePwd(){
  var np = prompt('请输入新的密钥（至少4位）：');
  if(np === null) return;
  if(np.length < 4) return toast('密钥至少4位','err');
  cur().pwd = np;
  saveDB();
  toast('已修改','ok');
}

/* ======================= 启动 ======================= */
function init(){
  var tip = document.getElementById('readyTip');
  if(tip) tip.textContent = '正在连接云端……';
  loadDB(function(err){
    if(tip) tip.textContent = err ? '云端连接失败，以本地模式运行' : '系统已就绪';
    if(DB && DB.session && DB.users[DB.session]){
      enterSite();
    }else{
      if(DB) DB.session = null;
      document.getElementById('loginView').classList.remove('hide');
      document.getElementById('app').classList.add('hide');
    }
    var lp = document.getElementById('loginPwd');
    if(lp) lp.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
    var rp = document.getElementById('regPwd2');
    if(rp) rp.addEventListener('keydown', function(e){ if(e.key === 'Enter') doRegister(); });
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}

document.getElementById('modalMask').addEventListener('click', function(e){
  if(e.target.id === 'modalMask') e.target.classList.remove('show');
});
</script>
